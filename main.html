<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROOMS</title>
<style>
:root{--bg:#000;--fg:#fff;--dim:#8a8a8a;--line:#222;--hover:#0d0d0d;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#222;border-radius:3px}
.view{display:none;min-height:100dvh}.view.on{display:flex}
#auth,#lobby{flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;padding:2.5rem 1rem}
h1{font-size:2.2rem;font-weight:800;letter-spacing:-.04em;line-height:1}
h2{font-size:.8rem;font-weight:500;color:var(--dim);margin-bottom:.2rem}
.box{width:100%;max-width:380px;border:1px solid var(--line);border-radius:14px;padding:1.4rem;display:flex;flex-direction:column;gap:.8rem}
.row{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;width:100%;max-width:780px}
.row .box{flex:1;min-width:260px;max-width:none}
input{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:.7rem .9rem;font:inherit;font-size:16px;outline:none;transition:border-color .15s}
input:focus{border-color:#666}input::placeholder{color:#555}
button{font:inherit;font-weight:600;background:var(--fg);color:var(--bg);border:1px solid var(--fg);border-radius:var(--r);padding:.65rem 1rem;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.85}
button.ghost{background:none;color:var(--fg);border-color:var(--line);font-weight:500;padding:.45rem .8rem;font-size:.85rem}
button.ghost:hover{border-color:#666;opacity:1}
button:disabled{opacity:.4;cursor:default}
.link{background:none!important;border:0!important;color:var(--dim);padding:0!important;text-decoration:underline;font-size:.85rem;font-weight:400}
.tabs{display:flex;gap:1.25rem;margin-bottom:.2rem}
.tabs button{background:none;border:0;border-radius:0;color:var(--dim);padding:0 0 .35rem;border-bottom:2px solid transparent;font-weight:500}
.tabs button.on{color:var(--fg);border-color:var(--fg)}
.note{color:var(--dim);font-size:.85rem;min-height:1.2em}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:.25rem .8rem;cursor:pointer;color:var(--dim);font-size:.9rem}
.chip:hover{color:var(--fg);border-color:#666}
.bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;justify-content:center;color:var(--dim)}
#who{color:var(--fg);font-weight:600}
#chat{flex-direction:column;height:100dvh}
.top{display:flex;align-items:center;gap:.75rem;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.top b{flex:1;font-size:1.05rem;letter-spacing:-.01em}
.body{flex:1;display:flex;min-height:0}
.side{width:210px;border-right:1px solid var(--line);padding:1rem .6rem;overflow-y:auto}
.side.r{border:0;border-left:1px solid var(--line)}
.side h2{padding:0 .6rem;margin-bottom:.5rem}
.side div{padding:.35rem .6rem;border-radius:8px;color:var(--dim);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side div:hover{background:var(--hover);color:var(--fg)}
.side div.cur{background:#161616;color:var(--fg)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:1rem 1.25rem}
.msg{padding:.45rem .75rem;margin:0 -.75rem;border-radius:10px;border-left:2px solid transparent;position:relative}
.msg:hover{background:var(--hover)}
.msg.ping{border-left-color:var(--fg);background:#141414;border-radius:4px 10px 10px 4px}
.msg .h{display:flex;gap:.5rem;align-items:baseline}
.msg .n{font-weight:600}.msg .t{color:#666;font-size:.72rem}
.msg .x{position:absolute;right:.4rem;top:.3rem;background:none;border:0;color:var(--dim);padding:0 .5rem;display:none;font-size:1.1rem}
.msg:hover .x{display:block}
.msg .p{word-break:break-word;white-space:pre-wrap;color:#e6e6e6}
.b{font-size:.62rem;border:1px solid #666;border-radius:4px;padding:0 .35rem;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);align-self:center}
.b.owner{background:var(--fg);color:var(--bg);border-color:var(--fg)}.b.vip{border-style:dashed}
#mute{display:none;text-align:center;padding:.5rem;color:var(--dim);border-top:1px solid var(--line)}#mute.on{display:block}
.send{display:flex;gap:.5rem;padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.send input{border-radius:999px;padding:.7rem 1.1rem}
.send button{border-radius:999px;padding:.6rem 1.3rem}
.empty{color:var(--dim);text-align:center;padding:2rem}
#toast{position:fixed;left:50%;bottom:5rem;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.6rem 1.1rem;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1}
dialog{background:var(--bg);color:var(--fg);border:1px solid #444;border-radius:14px;padding:1.4rem;margin:auto;width:min(360px,calc(100% - 2rem))}
dialog::backdrop{background:rgba(0,0,0,.8)}
dialog .box{border:0;padding:0;max-width:none}
@media(max-width:700px){.side{display:none}}
@media(max-width:900px){.side.r{display:none}}
</style></head><body>

<div id="auth" class="view on">
  <h1>ROOMS</h1>
  <div class="box">
    <div class="tabs"><button id="tIn" class="on">Sign in</button><button id="tUp">Create account</button></div>
    <div id="fIn" class="box" style="padding:0;border:0;max-width:none">
      <input id="siEmail" type="email" placeholder="Email" autocomplete="email">
      <input id="siPw" type="password" placeholder="Password" autocomplete="current-password">
      <button id="bIn">Sign in</button>
      <button id="bReset" class="link" style="align-self:flex-start">Forgot password?</button>
    </div>
    <div id="fUp" class="box" style="padding:0;border:0;max-width:none;display:none">
      <input id="suEmail" type="email" placeholder="Email" autocomplete="email">
      <input id="suName" placeholder="Display name (letters, numbers, _ -)" maxlength="20" autocomplete="off">
      <input id="suPw" type="password" placeholder="Password (8+ characters)" autocomplete="new-password">
      <button id="bUp">Create account</button>
    </div>
    <div id="aNote" class="note"></div>
  </div>
</div>

<div id="lobby" class="view">
  <h1>ROOMS</h1>
  <div class="bar"><span id="who"></span><button class="ghost" id="bPanic">Panic key</button><button class="ghost" id="bOut">Sign out</button></div>
  <div id="verify" class="bar note" style="display:none">Verify your email to send messages.
    <button class="ghost" id="bVer">I verified</button><button class="ghost" id="bResend">Resend</button></div>
  <div class="row">
    <div class="box"><h2>Create room</h2>
      <input id="cName" placeholder="room-name" maxlength="30"><div id="cWarn" class="note"></div><input id="cPw" type="password" placeholder="Room password">
      <button id="bCreate">Create and enter</button></div>
    <div class="box"><h2>Join room</h2>
      <input id="jName" placeholder="room-name" maxlength="30"><input id="jPw" type="password" placeholder="Room password">
      <button id="bJoin">Join</button></div>
  </div>
  <div class="box" style="max-width:780px"><h2>Rooms</h2><div id="chips" class="chips"></div></div>
</div>

<div id="chat" class="view">
  <div class="top"><b id="rName"></b><span id="online" class="note"></span>
    <button class="ghost" id="bPanic2">Panic key</button><button class="ghost" id="bLeave">Leave</button></div>
  <div class="body">
    <div class="side"><h2>Rooms</h2><div id="sideRooms"></div></div>
    <div class="main"><div id="msgs"></div><div id="mute"></div>
      <div class="send"><input id="msgInput" maxlength="500" autocomplete="off" placeholder="Message"><button id="bSend">Send</button></div></div>
    <div class="side r"><h2>Online</h2><div id="members"></div></div>
  </div>
</div>

<dialog id="dlg"><div class="box"><h2>Panic key</h2>
  <button class="ghost" id="bRec">Keys: </button>
  <input id="pUrl" placeholder="Redirect URL (blank closes the tab)">
  <button id="bSavePanic">Save</button><button class="ghost" id="bCloseDlg">Cancel</button></div></dialog>
<div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {initializeAuth,inMemoryPersistence,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendEmailVerification,sendPasswordResetEmail,onAuthStateChanged,signOut,reload,deleteUser} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {getDatabase,ref,get,set,push,remove,onValue,onChildAdded,onChildRemoved,query,limitToLast,serverTimestamp,onDisconnect} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app=initializeApp({apiKey:"AIzaSyDN1NehgSktEGdOEABz8igeRosogLOgzYU",authDomain:"project-50a73.firebaseapp.com",databaseURL:"https://project-50a73-default-rtdb.firebaseio.com",projectId:"project-50a73",storageBucket:"project-50a73.firebasestorage.app",messagingSenderId:"395823874797",appId:"1:395823874797:web:a408782869b31984a342e4"});
const auth=initializeAuth(app,{persistence:inMemoryPersistence}),db=getDatabase(app);
const keys={};
const OWNER='lb6486262@gmail.com';
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const R=p=>ref(db,p);
const show=v=>['auth','lobby','chat'].forEach(i=>$(i).classList.toggle('on',i===v));
let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)};
const errMsg=e=>({'auth/invalid-credential':'Wrong email or password','auth/email-already-in-use':'Email already registered','auth/weak-password':'Password too weak','auth/too-many-requests':'Too many attempts. Wait and retry','auth/invalid-email':'Invalid email'}[e.code]||e.message||'Something went wrong');
const note=m=>$('aNote').textContent=m||'';

const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const sha256=async s=>hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));
const newSalt=()=>hex(crypto.getRandomValues(new Uint8Array(16)));
async function hashPw(p,s){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(s),iterations:100000,hash:'SHA-256'},k,256))}
const slug=s=>s.trim().toLowerCase().replace(/[\s_]+/g,'-').replace(/[^a-z0-9-]/g,'').slice(0,30);
const validRoom=n=>/^[a-z0-9-]{1,30}$/.test(n);

let me=null,roles={},rooms={},room=null,unsub=[],globalUnsub=[],signingUp=false,muteUntil=0,muteT,last=0,unread=0,joinedAt=0;
const isOwner=()=>roles[me?.uid]==='owner',isStaff=()=>isOwner()||roles[me?.uid]==='mod';

// ── auth ──
const tab=t=>{$('tIn').classList.toggle('on',t==='in');$('tUp').classList.toggle('on',t==='up');$('fIn').style.display=t==='in'?'':'none';$('fUp').style.display=t==='up'?'':'none';note()};
$('tIn').onclick=()=>tab('in');$('tUp').onclick=()=>tab('up');
async function signIn(){
  try{note('Signing in…');await signInWithEmailAndPassword(auth,$('siEmail').value.trim().toLowerCase(),$('siPw').value)}catch(e){note(errMsg(e))}
}
async function signUp(){
  const email=$('suEmail').value.trim().toLowerCase(),name=$('suName').value.trim(),pw=$('suPw').value;
  if(!/^\S+@\S+\.\S+$/.test(email))return note('Enter a valid email');
  if(!/^[\w-]{2,20}$/.test(name))return note('Name: 2–20 letters, numbers, _ or -');
  if(pw.length<8)return note('Password needs 8+ characters');
  signingUp=true;note('Creating account…');
  try{
    const {user}=await createUserWithEmailAndPassword(auth,email,pw);
    try{await set(R('names/'+name.toLowerCase()),user.uid)}catch{await deleteUser(user);throw new Error('That name is taken')}
    await set(R('users/'+user.uid),{name});
    await sendEmailVerification(user).catch(()=>{});
    signingUp=false;boot(user);
  }catch(e){signingUp=false;note(errMsg(e))}
}
$('bIn').onclick=signIn;$('bUp').onclick=signUp;
$('siPw').onkeydown=e=>e.key==='Enter'&&signIn();
$('bReset').onclick=async()=>{const m=$('siEmail').value.trim();if(!m)return note('Enter your email first');
  try{await sendPasswordResetEmail(auth,m);note('Reset email sent')}catch(e){note(errMsg(e))}};
$('bOut').onclick=()=>signOut(auth);

onAuthStateChanged(auth,u=>{if(signingUp)return;if(u)boot(u).catch(e=>{note(errMsg(e));show('auth')});else{teardown();show('auth')}});

async function ensureOwner(){
  if(me.email===OWNER&&auth.currentUser.emailVerified)await set(R('roles/'+me.uid),'owner').catch(()=>{});
}
async function boot(user){
  let s;
  try{s=await get(R('users/'+user.uid))}catch{await signOut(auth);return note('Database denied access. Publish database.rules.json in Firebase → Realtime Database → Rules.')}
  if(!s.exists()){
    const name=(prompt('Pick a display name (letters, numbers, _ -)')||'').trim();
    if(!/^[\w-]{2,20}$/.test(name)){await signOut(auth);return note('Name must be 2–20 letters, numbers, _ or -')}
    try{await set(R('names/'+name.toLowerCase()),user.uid);await set(R('users/'+user.uid),{name});s=await get(R('users/'+user.uid))}
    catch{await signOut(auth);return note('Name taken or database denied. Try another name.')}
  }
  me={uid:user.uid,name:s.val().name,email:(user.email||'').toLowerCase()};
  $('who').textContent=me.name;
  $('verify').style.display=user.emailVerified?'none':'flex';
  await ensureOwner();
  if(me.email===OWNER)get(R('rooms')).then(async s=>{for(const [n,r] of Object.entries(s.val()||{}))if(r&&r.h){await set(R('roomKeys/'+n),r.h);await remove(R('rooms/'+n+'/h'))}}).catch(()=>{});
  if(me.email!==OWNER)set(R('members/__rulecheck/'+me.uid),'x').then(()=>{remove(R('members/__rulecheck/'+me.uid));alert('Database rules are NOT active: any room password works. Publish database.rules.json in Firebase → Realtime Database → Rules.')}).catch(()=>{});
  globalUnsub.forEach(f=>f());
  globalUnsub=[
    onValue(R('roles'),s=>{roles=s.val()||{};refreshBadges()}),
    onValue(R('rooms'),s=>{rooms=s.val()||{};renderRooms()},()=>{})
  ];
  show('lobby');
}
function teardown(){stopRoom();globalUnsub.forEach(f=>f());globalUnsub=[];me=null;roles={};rooms={}}
$('bVer').onclick=async()=>{await reload(auth.currentUser);await auth.currentUser.getIdToken(true);
  if(auth.currentUser.emailVerified){$('verify').style.display='none';await ensureOwner();toast('Email verified')}else toast('Not verified yet. Check spam too.')};
$('bResend').onclick=()=>sendEmailVerification(auth.currentUser).then(()=>toast('Verification email sent')).catch(()=>toast('Try again shortly'));

// ── rooms ──
function renderRooms(){
  const names=Object.keys(rooms).sort();
  const c=$('chips');c.replaceChildren();
  if(!names.length)c.append(el('span','note','No rooms yet. Create one.'));
  names.forEach(n=>{const x=el('div','chip','#'+n);x.onclick=()=>{$('jName').value=n;$('jPw').focus()};c.append(x)});
  const s=$('sideRooms');s.replaceChildren();
  names.forEach(n=>{const x=el('div',n===room?'cur':'','# '+n);x.onclick=()=>switchTo(n);s.append(x)});
}
async function createRoom(){
  const raw=$('cName').value.trim();
  if(raw&&!/^[A-Za-z0-9-]+$/.test(raw))return toast('Room names can only use letters, numbers and hyphens. Please remove other characters.');
  if(raw&&raw===$('cPw').value)return toast("Don't use your password as the room name. Everyone can see room names.");
  const n=slug($('cName').value),p=$('cPw').value;
  if(!validRoom(n))return toast('Enter a room name first (letters, numbers, hyphens). The password goes in the box below it.');
  if(!p)return toast('Set a password');
  if(!auth.currentUser.emailVerified)return toast('Verify your email first');
  try{
    const salt=newSalt(),h=await hashPw(p,salt);
    await set(R('roomKeys/'+n),h);
    await set(R('rooms/'+n),{salt,by:me.uid,created:serverTimestamp()});
    await set(R('members/'+n+'/'+me.uid),h);
    keys['k_'+n]=h;enter(n);
  }catch{toast('Could not create. The name may be taken.')}
}
async function joinRoom(n,p){
  const r=await get(R('rooms/'+n)).catch(()=>null);
  if(!r||!r.exists())return toast('Room not found');
  const h=r.val().salt?await hashPw(p,r.val().salt):await sha256(p);
  try{await set(R('members/'+n+'/'+me.uid),h);keys['k_'+n]=h;enter(n)}catch{toast('Wrong password')}
}
async function switchTo(n){
  if(n===room)return;
  const h=keys['k_'+n];stopRoom();
  if(h){try{await set(R('members/'+n+'/'+me.uid),h);return enter(n)}catch{}}
  $('jName').value=n;show('lobby');toast('Enter the password for #'+n);
}
$('cName').oninput=()=>{const v=$('cName').value;$('cWarn').textContent=v&&!/^[A-Za-z0-9-]+$/.test(v)?'Only letters, numbers and hyphens. Please remove other characters.':v&&v===$('cPw').value?"Don't use your password as the room name. Everyone can see room names.":''};
$('cPw').addEventListener('input',()=>$('cName').oninput());
$('bCreate').onclick=createRoom;
$('bJoin').onclick=()=>{const n=slug($('jName').value);if(!validRoom(n)||!$('jPw').value)return toast('Room name and password required');joinRoom(n,$('jPw').value)};

// ── chat ──
function enter(n){
  stopRoom();room=n;joinedAt=Date.now()-3000;unread=0;
  $('rName').textContent='#'+n;$('msgs').replaceChildren();$('msgInput').disabled=false;
  show('chat');renderRooms();$('msgInput').focus();
  const q=query(R('messages/'+n),limitToLast(100));
  const bad=()=>{if(room===n){toast('Lost access to #'+n);leave()}};
  const pr=R('presence/'+n+'/'+me.uid);
  set(pr,me.name).catch(()=>{});onDisconnect(pr).remove();
  unsub=[
    onChildAdded(q,s=>addMsg(s.key,s.val()),bad),
    onChildRemoved(q,s=>$('m_'+s.key)?.remove()),
    onValue(R('presence/'+n),s=>renderMembers(s.val()||{}),()=>{}),
    onValue(R('members/'+n+'/'+me.uid),s=>{if(room===n&&!s.exists()){toast('You were removed from #'+n);leave()}},()=>{}),
    onValue(R('mutes/'+n+'/'+me.uid),s=>{muteUntil=s.val()||0;tickMute()},()=>{}),
    onValue(R('rooms/'+n),s=>{if(room===n&&!s.exists()){toast('Room deleted');leave()}},()=>{})
  ];
}
function stopRoom(){
  if(room&&me)remove(R('presence/'+room+'/'+me.uid)).catch(()=>{});
  unsub.forEach(f=>f());unsub=[];room=null;muteUntil=0;clearInterval(muteT);
  $('mute').classList.remove('on');document.title='ROOMS';
}
function leave(){stopRoom();show('lobby');renderRooms()}
$('bLeave').onclick=leave;

function badge(uid){const r=roles[uid];if(!r)return null;return el('span','b '+r,r)}
function refreshBadges(){document.querySelectorAll('[data-uid]').forEach(s=>{s.replaceChildren();const b=badge(s.dataset.uid);if(b)s.append(b)})}
function addMsg(id,m){
  if(m.type==='system')return;
  const box=$('msgs'),stick=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  const ping=me&&m.uid!==me.uid&&String(m.text).toLowerCase().includes('@'+me.name.toLowerCase());
  const d=el('div','msg'+(ping?' ping':''));d.id='m_'+id;
  const h=el('div','h'),slot=el('span');slot.dataset.uid=m.uid;const b=badge(m.uid);if(b)slot.append(b);
  h.append(el('span','n',m.name||m.user),slot,el('span','t',new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})));
  d.append(h,el('div','p',m.text));
  const x=el('button','x','×');x.title='Delete';x.onclick=()=>remove(R('messages/'+room+'/'+id)).catch(()=>toast('Not allowed'));
  d.append(x);box.append(d);
  if(stick)box.scrollTop=box.scrollHeight;
  if(document.hidden&&m.uid!==me.uid&&m.ts>joinedAt)document.title='('+(++unread)+') ROOMS';
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){unread=0;document.title='ROOMS'}});
function renderMembers(p){
  const m=$('members');m.replaceChildren();
  Object.entries(p).forEach(([uid,name])=>{const d=el('div','',name);const b=badge(uid);if(b){d.append(' ',b)}m.append(d)});
  $('online').textContent=Object.keys(p).length+' online';
}
function tickMute(){
  clearInterval(muteT);
  const f=()=>{const s=Math.ceil((muteUntil-Date.now())/1000);$('mute').classList.toggle('on',s>0);
    $('mute').textContent='You are muted for '+s+'s';$('msgInput').disabled=s>0;if(s<=0)clearInterval(muteT)};
  f();muteT=setInterval(f,500);
}
async function send(){
  const i=$('msgInput'),t=i.value.trim();
  if(!t||!room)return;
  if(!auth.currentUser.emailVerified)return toast('Verify your email first');
  if(Date.now()<muteUntil)return toast('You are muted');
  if(Date.now()-last<800)return toast('Slow down');
  i.value='';
  if(t[0]==='/')return cmd(t);
  last=Date.now();
  try{await push(R('messages/'+room),{uid:me.uid,name:me.name,text:t,ts:serverTimestamp()})}
  catch(e){i.value=t;toast('Send failed: '+(e.code||e.message))}
}
$('bSend').onclick=send;
$('msgInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};

async function uidOf(n){const s=await get(R('names/'+String(n||'').toLowerCase()));return s.exists()?s.val():null}
async function cmd(t){
  const [c,a,b]=t.split(/\s+/);
  if(c==='/help')return toast(isOwner()?'/mute name sec · /kick name · /role name mod|vip|none · /delroom':isStaff()?'/mute name sec (max 30) · /kick name':'No commands available');
  if(!isStaff())return toast('No permission');
  try{
    if(c==='/mute'||c==='/kick'||(c==='/role'&&isOwner())){
      const u=await uidOf(a);if(!u)return toast('No such user');
      if(c==='/mute'){let s=parseInt(b)||10;if(!isOwner())s=Math.min(s,30);await set(R('mutes/'+room+'/'+u),Date.now()+s*1000);return toast('Muted '+a+' for '+s+'s')}
      if(c==='/kick'){await remove(R('members/'+room+'/'+u));return toast('Kicked '+a)}
      if(['mod','vip'].includes(b)){await set(R('roles/'+u),b);return toast(a+' is now '+b)}
      if(b==='none'){await remove(R('roles/'+u));return toast('Role removed from '+a)}
      return toast('Usage: /role name mod|vip|none');
    }
    if(c==='/delroom'&&isOwner()&&confirm('Delete #'+room+' permanently?')){
      const n=room;stopRoom();show('lobby');
      for(const p of ['messages','presence','mutes','members','rooms','roomKeys'])await remove(R(p+'/'+n));
      return toast('Room deleted');
    }
    toast('Unknown command. Try /help');
  }catch{toast('Not allowed')}
}

// ── panic key ──
let panic={keys:['Digit0','Digit9'],url:'https://google.com'};
try{Object.assign(panic,JSON.parse(localStorage.getItem('panic')||'{}'))}catch{}
const held=new Set();let rec=null;
const keyName=k=>k.replace(/^(Digit|Key)/,'');
const fire=()=>{if(/^https?:\/\//i.test(panic.url))location.href=panic.url;else{window.close();location.href='about:blank'}};
addEventListener('keydown',e=>{
  if(rec){e.preventDefault();rec.add(e.code);$('bRec').textContent='Keys: '+[...rec].map(keyName).join(' + ');return}
  held.add(e.code);
  if(panic.keys.length&&panic.keys.every(k=>held.has(k)))fire();
});
addEventListener('keyup',e=>{if(rec&&rec.size){panic.keys=[...rec];rec=null}held.delete(e.code)});
addEventListener('blur',()=>held.clear());
const openPanic=()=>{$('bRec').textContent='Keys: '+(panic.keys.map(keyName).join(' + ')||'none');$('pUrl').value=panic.url;$('dlg').showModal()};
$('bRec').onclick=()=>{rec=new Set();$('bRec').textContent='Press keys…'};
$('bSavePanic').onclick=()=>{rec=null;panic.url=$('pUrl').value.trim();try{localStorage.setItem('panic',JSON.stringify(panic))}catch{}$('dlg').close();toast('Saved')};
$('bCloseDlg').onclick=()=>{rec=null;$('dlg').close()};
$('bPanic').onclick=openPanic;$('bPanic2').onclick=openPanic;
</script></body></html>
